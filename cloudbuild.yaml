steps:
  # 1. Monorepo Dependency Setup & Build
  - name: 'node:22'
    entrypoint: 'sh'
    args: ['-c', 'corepack enable && pnpm install --frozen-lockfile']
    id: 'install-dependencies'

  - name: 'node:22'
    entrypoint: 'sh'
    args: ['-c', 'corepack enable && pnpm build:api']
    id: 'build-api'

  # 2. Secret Scanning (Gitleaks)
  - name: 'zricethezav/gitleaks:v8.18.2'
    args: ['detect', '--verbose', '--source=.']
    id: 'gitleaks-scan'

  # 3. OpenAPI Spec Lint
  - name: 'node:22'
    entrypoint: 'sh'
    args: ['-c', 'corepack enable && pnpm run lint:openapi']
    id: 'openapi-lint'

  # 4. Terraform Validation
  - name: 'hashicorp/terraform:1.6'
    dir: 'infrastructure/terraform/environments/dev'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        terraform init -backend=false
        terraform validate
    id: 'terraform-validate'

  # 5. Backend Unit & Regression Tests
  - name: 'node:22'
    entrypoint: 'sh'
    args: ['-c', 'corepack enable && pnpm test:fast']
    id: 'backend-tests'

  # 6. Flutter Analysis & Tests
  - name: 'ghcr.io/cirruslabs/flutter:3.27.4'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        for app in apps/customer_mobile apps/partner_mobile apps/merchant_mobile apps/hub_mobile; do
          echo "Analyzing $app..."
          (cd $app && flutter analyze && flutter test)
        done
    id: 'flutter-tests'

  # 7. Canary Deploy to Cloud Run (Staging Environment)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'allgo-api-staging'
      - '--image=gcr.io/$PROJECT_ID/allgo-api:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--tag=canary'
      - '--no-traffic'
    id: 'canary-deploy'

images:
  - 'gcr.io/$PROJECT_ID/allgo-api:$SHORT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
