services:
  # 1. Core API Service (NestJS REST & Real-time WebSockets)
  - type: web
    name: allgo-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @allgo/api... build
    startCommand: node services/api/dist/main.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://allgo-admin.onrender.com,https://allgo-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: SMS_GATEWAY_API_KEY
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: KMS_KEY_ID
        sync: false
      - key: DISPATCH_SEARCH_RADIUS_KM
        value: "5"
      - key: DISPATCH_MATCH_TIMEOUT_SEC
        value: "20"

  # 2. Admin Web Console (Next.js 16)
  - type: web
    name: allgo-admin
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @allgo/admin... build
    startCommand: pnpm --filter @allgo/admin start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
      - key: NEXT_PUBLIC_API_URL
        value: https://allgo-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  # 3. Webhooks Worker (Razorpay Signature Verification & Idempotency)
  - type: web
    name: allgo-webhooks
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @allgo/webhooks... build
    startCommand: node services/webhooks/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: REDIS_URL
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # 4. Standalone Dispatch Engine Worker
  - type: worker
    name: allgo-dispatch
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @allgo/dispatch... build
    startCommand: node services/dispatch/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DISPATCH_SEARCH_RADIUS_KM
        value: "5"
      - key: DISPATCH_MATCH_TIMEOUT_SEC
        value: "20"
