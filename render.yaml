services:
  - type: web
    name: allgo-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
