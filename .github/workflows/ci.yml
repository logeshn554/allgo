name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  secret-scan:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Terraform Validate Dev
        run: |
          cd infrastructure/terraform/environments/dev
          terraform init -backend=false
          terraform validate

  backend-and-contracts:
    name: Lint, Typecheck & Test Backend
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      JWT_SECRET: ci-mock-jwt-secret-allgo-monorepo-32chars
      JWT_EXPIRY: 3600
      DATABASE_URL: postgresql://allgo:allgo@localhost:5432/allgo_test
      REDIS_URL: redis://localhost:6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: ./dist/storage
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      API_BASE_URL: https://allgo-api.onrender.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome Lint & Format Check
        run: pnpm lint

      - name: Lint OpenAPI Spec
        run: pnpm run lint:openapi

      - name: Build & Typecheck Workspaces (Turborepo)
        run: pnpm build && pnpm typecheck

      - name: Run Workspace, Security, and Admin Tests
        run: pnpm test:fast

  mobile-apps-validation:
    name: Flutter Analyze, Test & Android Emulator CI (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    needs: backend-and-contracts
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: Customer Mobile
            path: apps/customer_mobile
          - name: Merchant Mobile
            path: apps/merchant_mobile
          - name: Driver Partner Mobile
            path: apps/partner_mobile
          - name: Hub Operations Mobile
            path: apps/hub_mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Provide Mock google-services.json
        run: |
          if [ -f "${{ matrix.app.path }}/android/app/google-services.json.example" ]; then
            cp "${{ matrix.app.path }}/android/app/google-services.json.example" "${{ matrix.app.path }}/android/app/google-services.json"
          fi

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app.path }}
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: ${{ matrix.app.path }}
        run: flutter analyze

      - name: Flutter Unit & Flow Tests
        working-directory: ${{ matrix.app.path }}
        run: flutter test

      - name: Android Emulator Integration Execution
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            cd ${{ matrix.app.path }}
            flutter test --reporter expanded

  mobile-ios-build:
    name: iOS Mobile Targets Build (macOS Runner)
    runs-on: macos-14
    needs: backend-and-contracts
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: Customer Mobile
            path: apps/customer_mobile
          - name: Merchant Mobile
            path: apps/merchant_mobile
          - name: Driver Partner Mobile
            path: apps/partner_mobile
          - name: Hub Operations Mobile
            path: apps/hub_mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app.path }}
        run: flutter pub get

      - name: Build iOS App Target (No Codesign for CI)
        working-directory: ${{ matrix.app.path }}
        run: flutter build ios --no-codesign --simulator

  canary-cloud-run-deploy:
    name: Canary Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [secret-scan, terraform-validate, backend-and-contracts, mobile-apps-validation, mobile-ios-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Canary Revision to Cloud Run
        run: |
          echo "Deploying Cloud Run canary revision with 0% initial traffic..."
          gcloud run deploy allgo-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/allgo-api:${{ github.sha }} \
            --region asia-south1 \
            --platform managed \
            --no-traffic \
            --tag canary
